[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mechanism-agent"
version = "0.6.0"
description = "Runnable reference implementation of the open research mechanism (claim board, three-outcome review, snapshots, dashboard)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
mechanism-agent = "mechanism_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
